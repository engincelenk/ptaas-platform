name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main]

defaults:
  run:
    working-directory: code

jobs:
  # ── API: Lint + Type-Check + Tests ──────────────────────────────────────────
  test-api:
    name: API (TypeScript)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ptaas_test
          POSTGRES_USER: ptaas
          POSTGRES_PASSWORD: testpassword
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: code/package-lock.json

      - name: Dependencies installieren
        run: npm ci

      - name: Prisma Client generieren
        run: npm run db:generate
        env:
          DATABASE_URL: postgresql://ptaas:testpassword@localhost:5432/ptaas_test

      - name: Schema auf Testdatenbank anwenden
        run: npm run --workspace=@ptaas/api exec -- prisma db push --accept-data-loss
        env:
          DATABASE_URL: postgresql://ptaas:testpassword@localhost:5432/ptaas_test

      - name: Type-Check
        run: npm run type-check --workspace=@ptaas/api

      - name: Lint
        run: npm run lint --workspace=@ptaas/api

      - name: Unit-Tests
        run: npm test --workspace=@ptaas/api
        env:
          DATABASE_URL: postgresql://ptaas:testpassword@localhost:5432/ptaas_test
          REDIS_URL: redis://localhost:6379
          INTERNAL_API_KEY: test_key_ci
          AUTH_BYPASS: "true"
          NODE_ENV: test

  # ── Frontend: Lint + Type-Check ─────────────────────────────────────────────
  test-web:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: code/package-lock.json

      - name: Dependencies installieren
        run: npm ci

      - name: Type-Check
        run: npm run type-check --workspace=@ptaas/web

      - name: Lint
        run: npm run lint --workspace=@ptaas/web

  # ── Scanner: Python-Tests ────────────────────────────────────────────────────
  test-scanner:
    name: Scanner (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: code/apps/scanner/requirements.txt

      - name: Dependencies installieren
        working-directory: code/apps/scanner
        run: pip install -r requirements.txt

      - name: Tests ausführen
        working-directory: code
        run: python -m pytest apps/scanner/tests -v

  # ── Security: Trivy ──────────────────────────────────────────────────────────
  security-scan:
    name: Security Scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trivy Filesystem-Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: code
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          format: table

  # ── Build: Docker-Images (nur bei master-Push) ───────────────────────────────
  build-and-push:
    name: Docker Build & Push
    needs: [test-api, test-web, test-scanner, security-scan]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: AWS-Credentials konfigurieren
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1

      - name: ECR Login
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: API-Image bauen & pushen
        uses: docker/build-push-action@v5
        with:
          context: code/apps/api
          target: production
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/ptaas-api:${{ github.sha }}
            ${{ steps.ecr-login.outputs.registry }}/ptaas-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scanner-Image bauen & pushen
        uses: docker/build-push-action@v5
        with:
          context: code/apps/scanner
          target: production
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/ptaas-scanner:${{ github.sha }}
            ${{ steps.ecr-login.outputs.registry }}/ptaas-scanner:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Deploy: EKS (nur nach erfolgreichem Build) ───────────────────────────────
  deploy:
    name: Deploy → EKS
    needs: [build-and-push]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: AWS-Credentials konfigurieren
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1

      - name: kubeconfig aktualisieren
        run: aws eks update-kubeconfig --name ptaas-prod --region eu-central-1

      - name: API deployen
        env:
          IMAGE_TAG: ${{ github.sha }}
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
        run: |
          kubectl set image deployment/ptaas-api \
            api=$ECR_REGISTRY/ptaas-api:$IMAGE_TAG \
            -n ptaas-prod
          kubectl rollout status deployment/ptaas-api \
            -n ptaas-prod --timeout=5m

      - name: Deployment-Status
        run: kubectl get pods -n ptaas-prod
