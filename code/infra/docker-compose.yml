version: "3.9"

# ── Gemeinsame Umgebungsvariablen ─────────────────────────────────────────────
x-api-env: &api-env
  DATABASE_URL: postgresql://ptaas:dev_password@postgres:5432/ptaas
  REDIS_URL: redis://redis:6379
  NODE_ENV: development
  PORT: "3001"
  INTERNAL_API_KEY: dev_internal_key_change_in_production
  AUTH_BYPASS: "true"
  # Clerk (nur in Produktion benötigt, Bypass aktiv)
  CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-sk_test_placeholder}
  CLERK_WEBHOOK_SECRET: ${CLERK_WEBHOOK_SECRET:-whsec_placeholder}

x-scanner-env: &scanner-env
  API_URL: http://api:3001
  REDIS_URL: redis://redis:6379
  INTERNAL_API_KEY: dev_internal_key_change_in_production

# ── Services ──────────────────────────────────────────────────────────────────
services:

  # ── Infrastruktur ─────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ptaas
      POSTGRES_USER: ptaas
      POSTGRES_PASSWORD: dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ptaas -d ptaas"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # ── Datenbankmigrationen (einmalig beim Start) ────────────────────────────
  migrate:
    build:
      context: ../apps/api
      target: development
    command: >
      sh -c "
        echo 'Warte auf Datenbank...' &&
        npx prisma generate &&
        npx prisma db push --accept-data-loss &&
        echo 'Migration abgeschlossen.'
      "
    environment:
      <<: *api-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # ── NestJS API ────────────────────────────────────────────────────────────
  api:
    build:
      context: ../apps/api
      target: development
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      <<: *api-env
    volumes:
      - ../apps/api/src:/app/src:ro
      - ../apps/api/prisma:/app/prisma:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Next.js Web-App ───────────────────────────────────────────────────────
  web:
    build:
      context: ../apps/web
      target: development
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NEXT_PUBLIC_WS_URL: ws://localhost:3001
      NEXT_PUBLIC_AUTH_BYPASS: "true"
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-pk_test_placeholder}
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
      NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL: /dashboard
      NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL: /dashboard
    volumes:
      - ../apps/web/src:/app/src:ro
    depends_on:
      api:
        condition: service_healthy

  # ── Python Scanner (BullMQ-Daemon) ────────────────────────────────────────
  scanner:
    build:
      context: ../apps/scanner
      target: development
    restart: unless-stopped
    environment:
      <<: *scanner-env
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  # ── BullMQ Queue-Dashboard (Bull Board) ──────────────────────────────────
  bull-board:
    image: ghcr.io/felixmosh/bull-board:latest
    restart: unless-stopped
    ports:
      - "3002:3000"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      BULL_PREFIX: bull
    depends_on:
      redis:
        condition: service_healthy

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
  redis_data:
