# HTTP → HTTPS redirect
server {
    listen 80;
    server_name _;

    # Health check endpoint for load balancers (no redirect)
    location /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — main server block
server {
    listen 443 ssl;
    http2  on;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;

    # Modern TLS only
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS (2 years)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Content-Security-Policy
    add_header Content-Security-Policy
        "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https:; font-src 'self'; frame-ancestors 'none';"
        always;

    # API proxy — /api/v1/*
    location /api/ {
        # Auth endpoints stricter rate limit
        location /api/v1/auth/ {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass http://api:3001;
            include /etc/nginx/conf.d/proxy_params.conf;
        }

        # Internal scanner endpoints — blocked from public internet
        location /api/v1/internal/ {
            deny all;
        }

        limit_req zone=api burst=20 nodelay;
        proxy_pass http://api:3001;
        include /etc/nginx/conf.d/proxy_params.conf;
    }

    # Frontend — everything else
    location / {
        limit_req zone=general burst=30 nodelay;
        proxy_pass http://web:3000;
        include /etc/nginx/conf.d/proxy_params.conf;
    }
}
