name: CI

on:
  push:
    branches: [main, master, "feature/**", "fix/**"]
  pull_request:
    branches: [main, master]
  workflow_call:   # Allow calling from release.yml

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Lint & Typecheck ───────────────────────────────────────────────────────
  lint-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck all packages
        run: npm run typecheck

      - name: Lint
        run: npm run lint --if-present

  # ── Unit Tests ─────────────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest (all workspaces)
        run: npm run test --workspaces --if-present

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.sha }}
          path: "**/coverage/"
          retention-days: 14
          if-no-files-found: ignore

  # ── Prisma Schema Validation ───────────────────────────────────────────────
  prisma-validate:
    name: Prisma Schema Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate --schema=packages/db/prisma/schema.prisma

      - name: Check Prisma client is up to date
        run: |
          npx prisma generate --schema=packages/db/prisma/schema.prisma
          git diff --exit-code packages/db/src/generated/ || \
            (echo "❌ Prisma client is out of date — run 'npm run db:generate'" && exit 1)

  # ── Dependency Security Audit ──────────────────────────────────────────────
  dependency-audit:
    name: Dependency Audit (ISO-DEV-06)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: npm audit (fail on high/critical)
        run: npm audit --audit-level=high

  # ── Python Audit ───────────────────────────────────────────────────────────
  python-audit:
    name: Python Dependency Audit (ISO-DEV-06)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: pip-audit (fail on critical)
        run: pip-audit -r apps/scanner/requirements.txt --severity critical

  # ── SBOM ───────────────────────────────────────────────────────────────────
  sbom:
    name: Generate SBOM (ISO-DEV-06)
    runs-on: ubuntu-latest
    needs: [lint-typecheck, unit-tests]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install CycloneDX
        run: npm install -g @cyclonedx/cyclonedx-npm

      - name: Generate SBOM
        run: cyclonedx-npm --output-format json --output-file sbom.json

      - name: Archive SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: sbom.json
          retention-days: 90

  # ── CI Gate ────────────────────────────────────────────────────────────────
  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    needs: [lint-typecheck, unit-tests, prisma-validate, dependency-audit]
    if: always()
    steps:
      - name: All required checks passed
        run: |
          if [[ "${{ needs.lint-typecheck.result }}" != "success" || \
                "${{ needs.unit-tests.result }}" != "success" || \
                "${{ needs.prisma-validate.result }}" != "success" || \
                "${{ needs.dependency-audit.result }}" != "success" ]]; then
            echo "❌ One or more required CI checks failed"
            exit 1
          fi
          echo "✅ All CI checks passed"
