version: 2
updates:
  # npm — root + all workspaces
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      nestjs:
        patterns: ["@nestjs/*"]
      next:
        patterns: ["next", "react", "react-dom", "@types/react*"]
      dev-tools:
        patterns: ["typescript", "vitest", "eslint*", "prettier*"]

  # pip — Python scanner worker
  - package-ecosystem: "pip"
    directory: "/apps/scanner"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
